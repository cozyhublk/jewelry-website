<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terms | Manarhey</title>
  <meta name="description" content="Terms for viewings, orders and bespoke work at Manarhey.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..500&family=Manrope:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/vendor/phosphor/phosphor-light.css">
  <link rel="stylesheet" href="styles.css">

<body class="page-simple">
  <header class="site-header is-scrolled simple-header">
    <div class="header-inner">
      <a class="link-arrow button-xsm" href="index.html"><i class="ph-light ph-arrow-left" aria-hidden="true"></i> Home</a>
      <a class="header-logo" href="index.html" aria-label="Manarhey home"><img src="assets/img/logo-dark.png" alt="Manarhey" width="1150" height="224"></a>
      <span></span>
    </div>
  </header>
  <main id="main">
    <div class="container">
      <article class="prose">
        <h1 class="heading-2">Terms</h1>
        <p class="caption-2 muted">Last updated <span class="token">{{date}}</span></p>
        <!-- Replace with the client's reviewed terms before launch. -->
        <h2 class="heading-5">Viewings</h2>
        <p class="body-3 muted"><span class="token">{{viewing_terms}}</span></p>
        <h2 class="heading-5">Bespoke orders and deposits</h2>
        <p class="body-3 muted"><span class="token">{{bespoke_terms}}</span></p>
        <h2 class="heading-5">Returns, exchanges and resizing</h2>
        <p class="body-3 muted"><span class="token">{{returns_policy}}</span></p>
      </article>
    </div>
  </main>
</body>
</html>
