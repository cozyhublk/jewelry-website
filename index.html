<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manarhey Concepts — Verge Global</title>
  <meta name="description" content="Three jewellery website design concepts for Manarhey, by Verge Global.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #032D55;
      --blue: #199aff;
      --teal: #29e8d9;
      --tint: #f0f6ff;
      --line: #e0efff;
      --muted: #5a7391;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { min-height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #fff;
      color: var(--navy);
      font: 400 16px/1.6 Inter, system-ui, sans-serif;
    }
    a { color: inherit; text-decoration: none; }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px clamp(16px, 5vw, 64px);
    }
    header img { height: 40px; width: auto; display: block; }
    .cta {
      padding: 10px 20px;
      border-radius: 999px;
      background: var(--navy);
      color: #fff;
      font: 600 14px "Plus Jakarta Sans", sans-serif;
      transition: background .2s;
    }
    .cta:hover { background: var(--blue); }

    main {
      flex: 1;
      padding: clamp(40px, 8vw, 88px) clamp(16px, 5vw, 64px);
      background: radial-gradient(circle at 50% 0%, var(--tint), #fff 60%);
    }
    .hero { text-align: center; max-width: 640px; margin: 0 auto; }
    .eyebrow {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      font: 800 clamp(2.25rem, 7vw, 4rem)/1.05 "Plus Jakarta Sans", sans-serif;
      letter-spacing: -.03em;
    }
    h1 span {
      background: linear-gradient(90deg, var(--blue), var(--teal));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .designs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: clamp(20px, 3vw, 32px);
      max-width: 1200px;
      margin: clamp(40px, 6vw, 72px) auto 0;
      padding: 0;
      list-style: none;
    }
    .design {
      display: block;
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      overflow: hidden;
      transition: border-color .2s, transform .25s, box-shadow .25s;
    }
    .design:hover, .design:focus-visible {
      border-color: var(--blue);
      transform: translateY(-4px);
      box-shadow: 0 24px 48px -24px rgba(3, 45, 85, .4);
      outline: none;
    }

    /* mini browser frame around each preview */
    .frame { background: var(--tint); border-bottom: 1px solid var(--line); }
    .frame-bar { display: flex; gap: 6px; padding: 10px 12px; }
    .frame-bar i { width: 8px; height: 8px; border-radius: 50%; background: #c9dcef; }
    .frame-view { aspect-ratio: 16 / 10; overflow: hidden; }
    .frame-view img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
      transition: transform .6s ease;
    }
    .design:hover .frame-view img { transform: scale(1.04); }

    .meta {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 20px;
    }
    .num {
      flex: none;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--navy);
      color: var(--teal);
      font: 600 13px "Plus Jakarta Sans", sans-serif;
    }
    .meta strong { display: block; font: 600 17px/1.3 "Plus Jakarta Sans", sans-serif; }
    .meta small { color: var(--muted); font-size: 14px; }
    .arrow { margin-left: auto; color: var(--blue); font-size: 20px; transition: transform .2s; }
    .design:hover .arrow { transform: translateX(4px); }

    footer {
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 8px;
    }
    footer a:hover { color: var(--blue); }
  </style>
</head>
<body>
  <header>
    <a href="https://verge-global.com/" aria-label="Verge Global">
      <img src="images/verge-logo-light.jpg" alt="Verge Global">
    </a>
    <a class="cta" href="https://verge-global.com/contact">Contact</a>
  </header>

  <main>
    <div class="hero">
      <span class="eyebrow">Manarhey &middot; Design Concepts</span>
      <h1>Jewelry, <span>refined.</span></h1>
    </div>

    <ul class="designs">
      <li>
        <a class="design" href="design-1/index.html">
          <div class="frame">
            <div class="frame-bar"><i></i><i></i><i></i></div>
            <div class="frame-view"><img src="images/previews/design-1.jpg" alt="Linen Studio homepage preview" loading="lazy"></div>
          </div>
          <div class="meta">
            <span class="num">01</span>
            <span><strong>Linen Studio</strong><small>Warm &amp; editorial</small></span>
            <span class="arrow" aria-hidden="true">&rarr;</span>
          </div>
        </a>
      </li>
      <li>
        <a class="design" href="design-2/index.html">
          <div class="frame">
            <div class="frame-bar"><i></i><i></i><i></i></div>
            <div class="frame-view"><img src="images/previews/design-2.jpg" alt="Ivory Atelier homepage preview" loading="lazy"></div>
          </div>
          <div class="meta">
            <span class="num">02</span>
            <span><strong>Ivory Atelier</strong><small>Light &amp; classic</small></span>
            <span class="arrow" aria-hidden="true">&rarr;</span>
          </div>
        </a>
      </li>
      <li>
        <a class="design" href="design-3/index.html">
          <div class="frame">
            <div class="frame-bar"><i></i><i></i><i></i></div>
            <div class="frame-view"><img src="images/previews/design-3.jpg" alt="Midnight Gallery homepage preview" loading="lazy"></div>
          </div>
          <div class="meta">
            <span class="num">03</span>
            <span><strong>Midnight Gallery</strong><small>Dark &amp; dramatic</small></span>
            <span class="arrow" aria-hidden="true">&rarr;</span>
          </div>
        </a>
      </li>
    </ul>
  </main>

  <footer>
    <span>&copy; 2026 Verge Global</span>
    <a href="mailto:info@verge-global.com">info@verge-global.com</a>
  </footer>
</body>
</html>
